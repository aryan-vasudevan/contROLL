; Hack the North badge -> F450 drone controller
; Target: ESP32-C3-MINI-1-N4 (U9 on badge.kicad_sch), 4 MB flash, no PSRAM.
; USB-C is wired to the C3's native USB peripheral (GPIO18/19 through the 33R
; series resistors R40/R41), so serial console runs over USB CDC.

; Two firmwares share this board and these drivers. They are different
; architectures on purpose, so pick the one that matches your setup:
;
;   pio run -e badge    badge speaks MAVLink straight to the aircraft over
;                       Wi-Fi. Needs a flight controller with a position
;                       estimate, so it is an outdoor, GPS, in-flight thing.
;
;   pio run -e pilink   badge sends button state to a Raspberry Pi as text and
;                       the Pi decides what to do with it. Works on a bench
;                       with the props off and no position estimate at all.
;
; `pio run` with no -e builds both.

[common]
platform      = espressif32
board         = esp32-c3-devkitm-1
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -Wall
    -Wextra

lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.0

[env:badge]
extends          = common
; Everything except the other firmware's entry point.
build_src_filter = +<*> -<pilink_main.cpp> -<badgecam_main.cpp>

[env:badgecam]
extends          = common
; Badge -> Pi button link PLUS the camera feed on the screen. Needs the full
; 160 MHz: JPEG decode is entirely compute-bound.
;
; Adafruit_ST7789 rather than TFT_eSPI. TFT_eSPI is faster, but its ESP32-C3
; path writes to SPI peripheral registers through base pointers that come out
; null on this chip: it panics inside begin_tft_write with a store fault at
; address 0x10 before drawing anything. Adafruit's driver goes through the
; Arduino SPI class throughout, so there is nothing chip-specific to get wrong.
build_src_filter = -<*> +<badgecam_main.cpp> +<buttons.cpp> +<leds.cpp> +<nfc.cpp> +<imu.cpp>
build_flags      = ${common.build_flags}
    -DBADGE_CAMERA=1
lib_deps         = ${common.lib_deps}
    adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.3
    adafruit/Adafruit GFX Library @ ^1.11.9
    bitbank2/JPEGDEC @ ^1.6.1

[env:pilink]
extends          = common
; Only the button link and the drivers it actually uses. The MAVLink codec,
; the aircraft state tracking and the IMU are all left out.
build_src_filter = -<*> +<pilink_main.cpp> +<buttons.cpp> +<leds.cpp>
